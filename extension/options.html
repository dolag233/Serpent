<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Serpent 扩展</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <h1>Serpent 扩展设置</h1>

      <section class="options-section">
        <label class="options-toggle">
          <input id="notifications-enabled" type="checkbox">
          <span>保存后显示系统通知</span>
        </label>
        <label class="options-toggle">
          <input id="focus-app-after-save" type="checkbox">
          <span>保存后显示 Serpent 窗口</span>
        </label>
        <label class="options-toggle">
          <input id="reveal-in-library-after-save" type="checkbox">
          <span>保存后跳转到目标文件夹并选中文件</span>
        </label>
        <label class="options-toggle">
          <input id="drag-radial-menu-enabled" type="checkbox">
          <span>拖拽网页图片/视频时显示保存轮盘</span>
        </label>
      </section>

      <p id="status" aria-live="polite"></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
