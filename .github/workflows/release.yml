name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      skip_verify:
        description: Skip rebuild + mainline verification (not recommended)
        type: boolean
        default: false
      skip_e2e:
        description: Skip packaged startup E2E
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            runner: macos-15
            artifact: serpent-release-darwin-arm64
          - platform: Windows x64
            runner: windows-2025
            artifact: serpent-release-win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CI: 'true'
    steps:
      - name: Check out Serpent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use the pinned Node release
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Verify mainline gates
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_verify != true }}
        run: npm run release:verify

      - name: Acquire media bundle
        run: npm run release:media

      - name: Package application
        run: npm run release:package

      - name: Packaged startup E2E
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_e2e != true }}
        run: npm run release:e2e:packaged

      - name: Create installers
        run: npm run release:make

      - name: Write checksum manifests
        run: npm run release:checksums

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            out/make/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@b14cf4c92620c250e1c074ab0a5800e37df86765 # v4.2.0
        with:
          path: release-dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: |
            release-dist/**