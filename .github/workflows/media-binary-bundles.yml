name: Media binary bundles

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/media-binary-bundles.yml'
      - 'resources/media-binaries/**'
      - 'scripts/media-binaries*.mjs'
      - 'scripts/media-build/**'
  pull_request:
    paths:
      - '.github/workflows/media-binary-bundles.yml'
      - 'resources/media-binaries/**'
      - 'scripts/media-binaries*.mjs'
      - 'scripts/media-build/**'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_BINARY_SOURCES: clear
    steps:
      - name: Check out Serpent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Assert target architecture
        shell: bash
        run: |
          set -eu
          case '${{ matrix.platform }}' in
            darwin-arm64) test "$(uname -s)-$(uname -m)" = Darwin-arm64 ;;
            win32-x64) test "$PROCESSOR_ARCHITECTURE" = AMD64 ;;
            *) exit 2 ;;
          esac

      # shell 属性不接受 matrix 表达式（解析器限制），按平台分步；
      # runner 上下文仅在 step 级可用（job 级 env 会导致解析失败）。
      - name: Build, inspect and archive bundle (darwin-arm64)
        if: matrix.platform == 'darwin-arm64'
        shell: bash
        env:
          SERPENT_MEDIA_BUILD_DIR: ${{ runner.temp }}/serpent-media-build
        run: ./scripts/media-build/darwin-arm64.sh
      - name: Build, inspect and archive bundle (win32-x64)
        if: matrix.platform == 'win32-x64'
        shell: pwsh
        env:
          SERPENT_MEDIA_BUILD_DIR: ${{ runner.temp }}/serpent-media-build
        run: ./scripts/media-build/win32-x64.ps1

      - name: Upload checksum-pinned bundle candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serpent-media-${{ matrix.platform }}
          path: |
            artifacts/media-binaries/serpent-media-${{ matrix.platform }}.zip
            artifacts/media-binaries/serpent-media-${{ matrix.platform }}.zip.sha256
            artifacts/media-binaries/serpent-media-${{ matrix.platform }}.manifest.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
