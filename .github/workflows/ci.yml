name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.platform }} verification
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            runner: macos-15
          - platform: Windows x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - name: Check out Serpent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use the pinned Node release
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Rebuild SQLite for Electron
        # GYP_MSVS_VERSION 跳过 node-gyp 的 VS 探测（windows-2025 镜像的
        # PowerShell 检测输出超 maxBuffer 导致 "Could not find any VS"）。
        env:
          GYP_MSVS_VERSION: 2026
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Static verification
        run: npm run lint && npm run typecheck && npm run extension:verify

      - name: Unit and Worker tests
        run: npm test

      - name: 100k search gate
        run: npm run test:perf:search

      - name: Electron user flows
        run: npm run test:e2e
