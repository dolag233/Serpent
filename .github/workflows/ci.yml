name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.platform }} verification
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            runner: macos-15
          - platform: Windows x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - name: Check out Serpent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use the pinned Node release
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Rebuild SQLite for Electron
        # windows-2022（VS 2022）——@electron/rebuild 3.x 的 node-gyp 正常识别；
        # windows-2025 已迁移 VS 2026（node-gyp<12.1 不识，见 node-gyp#3228）。
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Static verification
        run: npm run lint && npm run typecheck && npm run extension:verify

      - name: Unit and Worker tests
        run: npm test

      - name: 100k search gate
        run: npm run test:perf:search

      - name: Electron user flows
        run: npm run test:e2e

      - name: Upload E2E failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-test-results-${{ matrix.platform }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
