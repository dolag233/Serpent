<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Serpent Logo Concepts · 第二辑（简约概括向）</title>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; background: #101216; color: #e8eaf0; margin: 0; padding: 40px; }
  h1 { font-size: 20px; font-weight: 600; }
  .note { color: #8a90a0; font-size: 13px; margin-bottom: 32px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
  .card { background: #181b22; border: 1px solid #262a34; border-radius: 16px; padding: 24px; }
  .card h2 { font-size: 15px; margin: 0 0 4px; }
  .tag { display: inline-block; font-size: 11px; color: #0c0e12; background: #9be7c9; border-radius: 999px; padding: 2px 10px; margin-left: 8px; vertical-align: 2px; }
  .card p { font-size: 12.5px; color: #8a90a0; margin: 8px 0 20px; line-height: 1.6; }
  .hero { display: flex; justify-content: center; padding: 8px 0 20px; }
  .sizes { display: flex; align-items: flex-end; gap: 20px; }
  .sizes .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .sizes span { font-size: 10.5px; color: #6b7180; }
  .onlight { background: #e9ecf3; border-radius: 12px; padding: 14px 16px; }
  .ondark  { background: #0a0b0e; border-radius: 12px; padding: 14px 16px; }
  img { display: block; }
</style>
</head>
<body>
<h1>Serpent Logo Concepts · 第二辑</h1>
<p class="note">去卡通化：锐角几何、负形眼睛、收尖尾部。每个方案按 192 / 96 / 48 / 24 px 渲染并在深浅底上检查辨识度。SVG 源文件与本页同目录。</p>
<div class="grid" id="app"></div>
<script>
const concepts = [
  { file: 'f-ouroboros-geo.svg', name: 'F · 衔尾之环', tag: '衔尾蛇',
    desc: '几何化衔尾蛇：310° 环身 + 锐角箭头咬合收尖尾部，负形 slit 眼。暖纸底 + 翡翠→深青渐变，最克制、最"品牌"。' },
  { file: 'g-fangs.svg', name: 'G · 毒牙', tag: '毒牙 / 蛇信',
    desc: '两颗下垂的弯刃毒牙 + 中间吐信，大面积负空间。象牙白渐变 on 墨蓝，珊瑚红信子是唯一彩色，危险且高级。' },
  { file: 'h-tongue-s.svg', name: 'H · 信子 S', tag: '蛇信',
    desc: '单色 S 蛇身 + 三角蝮蛇头廓，头尾全部收尖，信子前吐。电紫单色 + 珊瑚信子，扁平有力，小尺寸最稳。' },
  { file: 'i-scales-s.svg', name: 'I · 鳞甲 S', tag: '鳞片',
    desc: 'S 由扇形叠鳞肌理构成，纯墨色 on 米白，箭形头 + 红信点缀。编辑感/奢感最强，近看有细节、远看是整字。' },
];
const sizes = [192, 96, 48, 24];
document.getElementById('app').innerHTML = concepts.map(c => `
  <div class="card">
    <h2>${c.name}<span class="tag">${c.tag}</span></h2>
    <p>${c.desc}</p>
    <div class="hero"><img src="${c.file}" width="192" height="192"></div>
    <div class="sizes">
      ${sizes.map(s => `<div class="cell ${s <= 48 ? 'ondark' : ''}">
        <img src="${c.file}" width="${s}" height="${s}"><span>${s}px</span></div>`).join('')}
      <div class="cell onlight"><img src="${c.file}" width="48" height="48"><span>亮底</span></div>
    </div>
  </div>`).join('');
</script>
</body>
</html>
